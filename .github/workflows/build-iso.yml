# Copper Linux
# Build Copper Linux as a bootable live ISO on GitHub Actions.
# Produces iso/out/copper.iso as an artifact.
#
# The build is split into per-stage steps on purpose: if a stage fails,
# the job API shows exactly which one, and the cached iso/work/ tree means
# re-runs skip everything that already built.

name: build-iso

on:
  push:
    branches: ['**']
  # A pull request is how work reaches this repo from a fork, and without this
  # line a PR gets no build at all: the workflow only ever ran on pushes to
  # branches in the repo itself, so a contributor with push rights got a green
  # tick on their fork and a redacted "no checks" on the PR. Half the bugs
  # fixed in this round were invisible to the build, so an unbuilt PR is not
  # obviously safe to merge.
  #
  # Cost: every PR now runs the full pipeline. From a warm cache that is a
  # couple of minutes; cold it is about fifteen, and the kernel is the bulk of
  # it. Worth it to know the thing builds before anyone reviews the diff.
  pull_request:
  workflow_dispatch:

jobs:
# Fast, and runs first. Nothing here builds anything: it is the set of
  # checks that catch a mistake in seconds instead of after a fifteen-minute
  # kernel build, and it needs no toolchain beyond a POSIX shell.
  #
  # Kept as its own job so a failure here is obviously not a compile error.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The last CI failure on this branch was `exit 126: Permission denied` on
      # the very first test, which meant the two tests after it never ran and
      # nobody knew they were missing from the tree entirely. That is thirteen
      # minutes of kernel build wasted, and it hid a second, worse problem: the
      # workflow invoked tests/charge.sh, which this branch does not have.
      #
      # So every script the workflow is about to run is checked for existence
      # and for the executable bit FIRST, and the whole check is one step. A
      # missing test or a lost mode is now a failure in seconds, with a message
      # that names the file, instead of a 126 thirteen minutes in.
      #
      # The executable bit does not survive a checkout on its own here: this
      # tree is maintained on Windows, where core.fileMode is off. That is why
      # tests/smoke.sh and tests/account.sh arrived non-executable.
      - name: every test is present and executable
        run: |
          set -eu
          bad=0
          for s in tests/smoke.sh tests/charge.sh tests/account-gate.sh \
                   tests/persist.sh tests/branch-gate.sh tests/startxfce-gate.sh \
                   tests/account.sh tests/init-session.sh \
                   tests/ingot-gate.sh tests/shutdown-gate.sh tests/xprobe-gate.sh \
                   tests/wifi-gate.sh; do
            if [ ! -e "$s" ]; then
              echo "::error::missing:$s -- the workflow runs it but it is not in the tree"
              bad=1
            elif [ ! -x "$s" ]; then
              echo "::error::not-executable:$s -- exit 126. Fix with: git update-index --chmod=+x $s"
              bad=1
            else
              echo "ok  $s"
            fi
          done
          # And they have to parse. A syntax error in a test is otherwise only
          # discovered when that particular test runs, which may be after the
          # tests that would have told us something more useful.
          for s in tests/*.sh iso/live/init \
                   iso/rootfs-overlay/usr/share/udhcpc/default.script; do
            bash -n "$s" || { echo "::error::syntax:$s"; bad=1; }
          done
          exit $bad

      - name: copper-sh smoke test
        run: |
          make -s
          ./tests/smoke.sh

      # Runs the rest of the suite and classifies the results. This branch is
      # `main` plus the display commits, so two of these tests describe
      # `untested`'s tree and fail here -- correctly, and by their own account:
      # one wants a hotfix URL fallback that iso/copper.sh does not implement on
      # this branch, and one wants to sabotage code inside untested's
      # 902-line wizard against this branch's 240-line one.
      #
      # branch-gate.sh asserts the *specific* signature of that known divergence
      # rather than skipping those tests, so a failure in a different shape --
      # a real regression -- still fails the build. If a test ever starts
      # passing it says so, which is the signal to delete its classification
      # instead of leaving a stale excuse in place.
      - name: charge / rollback and first-boot account gates
        run: sudo ./tests/branch-gate.sh

  # Deliberately NOT `needs: checks`. The checks job and this one run
  # concurrently, so a shell-level mistake is reported within a minute while
  # the kernel is still building, without withholding the artifact from a run
  # that only failed the fast checks.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install from-source build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-13 bison flex bc cpio rsync curl wget \
            xz-utils texinfo help2man autoconf automake libtool pkg-config libelf-dev \
            python3 perl gawk file xorriso mtools grub-pc-bin grub-efi-amd64-bin

      # build.sh pins the kernel compiler itself, and says why: gcc 15 rejects
      # this kernel's ACPI signature table under -Werror, so an unpinned runner
      # fails in ACPI code thousands of lines from anything that changed. The pin
      # lives in build.sh so local builds get it too -- this line only makes sure
      # the pinned compiler is actually installed, rather than assuming the
      # runner's default happens to be the right version. The job is pinned to
      # ubuntu-24.04, whose default gcc is 13; ubuntu-latest moves to Ubuntu 26
      # on 2026-10-19, and a from-source kernel build that fails only because
      # the base image moved is a failure with nothing to do with the change
      # under test.

      # The fallback prefix is deliberate: a warm iso/work/ saves a ~7 min
      # kernel build when something unrelated changed. What makes that safe
      # is in build.sh — every stage stamps its output with a hash of its
      # own inputs, so a restored tree still rebuilds any stage whose
      # sources moved. A cache hit now buys speed and cannot ship a stale
      # artifact, which is not something the key alone can promise: the key
      # changes on a source edit, but the fallback restores the previous
      # tree regardless, and plain existence checks in the stages would then
      # skip straight past the work that needed redoing.
      - name: Cache build tree (restore)
        uses: actions/cache/restore@v4
        with:
          path: iso/work
          key: copper-work-${{ hashFiles('iso/build.sh','iso/live/init','iso/boot/grub.cfg','iso/rootfs-overlay/**','iso/src-init/**','iso/firstboot/**','iso/plymouth/**','src/**','iso/sudo/**') }}
          restore-keys: |
            copper-work-

      - name: Build the kernel
        run: sudo bash iso/build.sh kernel

      - name: Build musl + busybox
        run: sudo bash iso/build.sh base

      - name: Build the command line tools
        run: sudo bash iso/build.sh tools

      # Wireless: wpa_supplicant built static against musl (with libnl), plus a
      # curated subset of linux-firmware. Its own step for the same reason as
      # gui below -- it downloads at build time (a kernel source and the
      # firmware package), and a failure should name the line that asked for
      # them rather than hiding inside "Make the ISO".
      - name: Build wireless support (wpa_supplicant + firmware)
        run: sudo bash iso/build.sh wifi

      - name: Build Copper's own binaries
        run: sudo bash iso/build.sh copper

      - name: Rootfs config + timezone
        run: sudo bash iso/build.sh rootfs

      # The display stack: Xorg + XFCE, downloaded as packages and unpacked
      # into the rootfs. Build-time network, none at runtime -- which is also
      # why it gets its own step instead of hiding inside "Make the ISO":
      # 217 MB of downloads is a failure you want attributed to the line
      # that asked for them.
      - name: Stage Xorg + XFCE into the rootfs
        run: sudo bash iso/build.sh gui

      # The boot splash: Ubuntu's prebuilt Plymouth plus the owner's frames,
      # unpacked into the rootfs. Its own step for the same reason as gui --
      # it downloads packages at build time, and a failure should name the
      # line that asked for them. rootfs and gui above are stamp-checked and
      # skip, so this resolves to just the splash.
      - name: Stage the boot splash (Plymouth)
        run: sudo bash iso/build.sh plymouth

      # sudo is a glibc binary against the gui closure's runtime, staged into
      # the rootfs so a normal user can run `ingot install` through it.
      # The sudo.stamp gate runs `sudo -V` inside the staged rootfs.
      - name: Build sudo into the rootfs
        run: sudo bash iso/build.sh sudo

      - name: Live initramfs
        run: sudo bash iso/build.sh initramfs

      - name: Make the ISO
        run: sudo bash iso/build.sh iso

      - name: Upload copper.iso
        uses: actions/upload-artifact@v4
        with:
          name: copper-iso
          path: iso/out/copper.iso
          retention-days: 14

      # The stages run under sudo, so iso/work is root-owned, and the cache
      # action tars it as the unprivileged runner: tar exits 2 on the first
      # file it cannot read (etc/shadow, the apt lock dirs, ssl/private), which
      # left the tree uncached and made every run cold. Hand the tree to the
      # runner first. This changes ownership only, never modes, and the ISO
      # stage already re-chowns every non-root entry back to 0:0 before it
      # packages the tree (see build_iso) -- the same uid-1000 state a cache
      # restore produces anyway.
      - name: Make the build tree readable by the cache
        if: always()
        run: |
          if [ -e iso/work ]; then
            sudo chown -R "$(id -u):$(id -g)" iso/work
          fi

      # Save the work tree even on failure so the next run resumes the
      # stages that already finished (kernel build is ~7 min).
      - name: Cache build tree (save)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: iso/work
          key: copper-work-${{ hashFiles('iso/build.sh','iso/live/init','iso/boot/grub.cfg','iso/rootfs-overlay/**','iso/src-init/**','iso/firstboot/**','iso/plymouth/**','src/**','iso/sudo/**') }}