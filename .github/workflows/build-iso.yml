# Copper Linux
# Build Copper Linux as a bootable live ISO on GitHub Actions.
# Produces iso/out/copper.iso as an artifact.
# Per-stage steps name the failing stage; the cached iso/work/ tree skips what already built.

name: build-iso

on:
  push:
    branches: ['**']
  # Without a pull_request trigger, fork PRs get no build and bugs reach review unbuilt.
  # Cost: full pipeline per PR (warm ~2 min, cold ~15, mostly kernel); worth it.
  pull_request:
  workflow_dispatch:

jobs:
# Fast, and runs first. Nothing here builds anything: it is the set of
  # checks that catch a mistake in seconds instead of after a fifteen-minute
  # kernel build, and it needs no toolchain beyond a POSIX shell.
  #
  # Kept as its own job so a failure here is obviously not a compile error.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Check existence and the executable bit before anything else: a missing test
      # or mode lost to a Windows checkout (core.fileMode off) fails in seconds, not after a ~13-min build.
      - name: every test is present and executable
        run: |
          set -eu
          bad=0
          for s in tests/smoke.sh tests/account-gate.sh \
                   tests/persist.sh tests/branch-gate.sh tests/startxfce-gate.sh \
                   tests/account.sh tests/init-session.sh \
                   tests/ingot-gate.sh tests/shutdown-gate.sh tests/xprobe-gate.sh \
                   tests/startniri-gate.sh \
                   tests/plymouth-gate.sh tests/polkit-gate.sh \
                   tests/network-gate.sh tests/console-gate.sh \
                   tests/systemd-gate.sh tests/systemd-gate-sabotage.sh \
                   tests/persist-sabotage.sh \
                   tests/kernel-gate.sh tests/kernel-gate-sabotage.sh \
                   tests/font-gate.sh tests/boot-gate.sh \
                   tests/shell-gate.sh tests/firstboot-eof-gate.sh \
                   tests/starthyprland-gate.sh tests/config-gate.sh \
                    tests/bootloader-gate.sh; do
            if [ ! -e "$s" ]; then
              echo "::error::missing:$s -- the workflow runs it but it is not in the tree"
              bad=1
            elif [ ! -x "$s" ]; then
              echo "::error::not-executable:$s -- exit 126. Fix with: git update-index --chmod=+x $s"
              bad=1
            else
              echo "ok  $s"
            fi
          done
          # And they have to parse. A syntax error in a test is otherwise only
          # discovered when that particular test runs, which may be after the
          # tests that would have told us something more useful.
          for s in tests/*.sh iso/live/init \
                   iso/rootfs-overlay/usr/share/udhcpc/default.script \
                   iso/systemd/copper-tty-clear \
                   iso/systemd/copper-dhcp \
                   iso/systemd/copper-zram \
                   iso/systemd/copper-zram-stop \
                   iso/systemd/copper-splash-show \
                   iso/systemd/copper-splash-quit; do
            bash -n "$s" || { echo "::error::syntax:$s"; bad=1; }
          done
          exit $bad

      - name: copper-sh smoke test
        run: |
          make -s
          ./tests/smoke.sh

      # The whole suite: shell, launchers, xprobe, the wizard's account
      # creation, persistence, ingot, systemd, the console font, and the
      # sabotage gates that prove each of those can fail. Root, so the
      # root-gated cases execute; the one contract that needs a non-root
      # user (ingot refusing to write /) drops privileges itself rather
      # than being recorded as passed without running.
      - name: the gate suite
        run: sudo ./tests/branch-gate.sh

  # Deliberately NOT `needs: checks`. The checks job and this one run
  # concurrently, so a shell-level mistake is reported within a minute while
  # the kernel is still building, without withholding the artifact from a run
  # that only failed the fast checks.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install from-source build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-13 bison flex bc cpio rsync curl wget \
            xz-utils texinfo help2man autoconf automake libtool pkg-config libelf-dev \
            python3 perl gawk file xorriso mtools grub-pc-bin grub-efi-amd64-bin \
            libglib2.0-dev-bin

      # libglib2.0-dev-bin provides glib-compile-schemas, which dpkg-deb -x never runs;
      # without it the ISO stage fails instead of shipping Firefox with no GSettings schemas.

      # build.sh pins gcc (gcc 15 breaks this kernel's ACPI under -Werror); install it
      # so a 24.04 image base move cannot fail a build for reasons unrelated to the change.

      # The fallback prefix saves ~7 min of kernel build; build.sh's input hashes
      # still rebuild changed stages, so a restored tree cannot ship a stale artifact.
      - name: Cache build tree (restore)
        uses: actions/cache/restore@v4
        with:
          path: iso/work
          key: copper-work-${{ hashFiles('iso/build.sh','iso/live/init','iso/boot/entries','iso/bootloaders/**','iso/rootfs-overlay/**','iso/src-init/**','iso/firstboot/**','iso/plymouth/**','src/**','iso/sudo/**') }}
          restore-keys: |
            copper-work-

      - name: Build the kernel
        run: sudo bash iso/build.sh kernel

      - name: Build musl + busybox
        run: sudo bash iso/build.sh base

      - name: Build the command line tools
        run: sudo bash iso/build.sh tools

      - name: Build Copper's own binaries
        run: sudo bash iso/build.sh copper

      - name: Rootfs config + timezone
        run: sudo bash iso/build.sh rootfs

      # The display stack: Xorg + XFCE, downloaded as packages and unpacked
      # into the rootfs. Build-time network, none at runtime -- which is also
      # why it gets its own step instead of hiding inside "Make the ISO":
      # 217 MB of downloads is a failure you want attributed to the line
      # that asked for them.
      - name: Stage Xorg + XFCE into the rootfs
        run: sudo bash iso/build.sh gui

      # The optional second desktop: niri from the praksharma PPA plus the
      # session config tree, fetched at a pinned commit and checked against
      # its sha256 (build_niri). Its own step for the same reason as gui and
      # plymouth -- it downloads at build time and a failure should name the
      # line that asked for it. rootfs and gui above are stamp-checked and
      # skip, so this resolves to just the niri session.
      - name: Stage the niri session
        run: sudo bash iso/build.sh niri

      # Hyprland is no longer baked into the image. Its compositor, config and
      # launcher ship as an ingot payload (`sudo ingot install hyprland`), so
      # there is no build-time stage to run here.

      # The boot splash: the prebuilt Plymouth packages plus the owner's frames,
      # unpacked into the rootfs. Its own step for the same reason as gui --
      # it downloads packages at build time, and a failure should name the
      # line that asked for them. rootfs and gui above are stamp-checked and
      # skip, so this resolves to just the splash.
      - name: Stage the boot splash (Plymouth)
        run: sudo bash iso/build.sh plymouth

      # sudo is a glibc binary against the gui closure's runtime, staged into
      # the rootfs so a normal user can run `ingot install` through it.
      # The sudo.stamp gate runs `sudo -V` inside the staged rootfs.
      - name: Build sudo into the rootfs
        run: sudo bash iso/build.sh sudo

      - name: Live initramfs
        run: sudo bash iso/build.sh initramfs

      # ---- the cache is saved HERE, before the unified merge ----------------
      # Save the plain pre-merge tree: the unified stage rewrites lib/systemd into a
      # symlink that breaks the next run's desktop cp; re-unpacking is cheaper than a broken cache.

      # chown before caching: sudo-owned files make tar fail and leave every run cold.
      # The setuid bits this clears are re-pinned by build_sudo and build_iso, not trusted to the cache.
      - name: Make the build tree readable by the cache
        if: always()
        run: |
          if [ -e iso/work ]; then
            sudo chown -R "$(id -u):$(id -g)" iso/work
          fi

      # Save the work tree even on failure so the next run resumes the
      # stages that already finished (kernel build is ~7 min).
      - name: Cache build tree (save)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: iso/work
          key: copper-work-${{ hashFiles('iso/build.sh','iso/live/init','iso/boot/entries','iso/bootloaders/**','iso/rootfs-overlay/**','iso/src-init/**','iso/firstboot/**','iso/plymouth/**','src/**','iso/sudo/**') }}

      # ---- one image, both inits -------------------------------------------
      # One ISO boots either init via copper.init=systemd, not two separately-swapped artifacts;
      # run AFTER the cache save so the rewritten tree is never cached.
      - name: Merge both inits into one image
        run: sudo bash iso/build.sh unified

      - name: Make the ISO
        run: sudo bash iso/build.sh iso

      # The one thing the gates in `checks` cannot do: start the image. Those
      # gates are structural, stubbed, or replayed in a mount namespace, so they
      # can all be green while the disc does not boot -- GRUB, the kernel, the
      # initramfs, finding the medium, the overlay and PID 1 only exist together
      # on the ISO. These boot it and read the serial console.
      - name: Install QEMU
        run: sudo apt-get install -y --no-install-recommends qemu-system-x86

      # The default entry: the disc's own GRUB, on the command line it ships.
      - name: Boot the default ISO
        run: ./tests/boot-gate.sh iso/out/copper.iso

      # Same image, with ttyS0 as the console, so the first-boot wizard draws
      # where the gate can see it. This is the only place the wizard is run on
      # a real boot; tests/account.sh drives the same binary but in a mount
      # namespace, with a fake /etc.
      - name: Boot the default ISO to the wizard
        run: ./tests/boot-gate.sh --serial iso/out/copper.iso

      # The other half of the same disc: copper.init=systemd makes /init exec
      # /lib/systemd/systemd. This is the only check that systemd actually
      # starts the Copper units from the shipped tree.
      - name: Boot the systemd init on the same ISO
        run: ./tests/boot-gate.sh --systemd iso/out/copper.iso

      - name: Upload copper.iso
        uses: actions/upload-artifact@v4
        with:
          name: copper-iso
          path: iso/out/copper.iso
          retention-days: 14