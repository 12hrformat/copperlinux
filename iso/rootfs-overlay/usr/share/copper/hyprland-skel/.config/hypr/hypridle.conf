# Copper Linux -- hypridle configuration.
# hypridle is started by hyprland.conf's exec-once. The locker is hyprlock; the
# timeout is deliberately conservative so a machine left at the prompt locks
# rather than staying open.

timeout = 300
on-timeout = hyprlock --immediate

timeout = 600
on-timeout = hyprctl dispatch dpms off
on-resume = hyprctl dispatch dpms on
