# Copper Linux -- hyprpaper configuration.
# Preload the branded wallpaper once, then apply it to every output that has
# none of its own. hyprpaper is started by hyprland.conf's exec-once, so this
# file is read as soon as the compositor comes up.

preload = ~/.config/hypr/wallpapers/copper-hyprland.png
wallpaper = ,~/.config/hypr/wallpapers/copper-hyprland.png

# No IPC by default: nothing else needs to ask hyprpaper for anything, and an
# open socket is one more thing a sandboxed app could reach.
ipc = off
