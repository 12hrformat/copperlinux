# Copper-branded Hyprwait configuration.
#
# Desktop: Copper Linux (https://github.com/12hrformat/copperlinux)
# Compositor: Hyprland (pinned in the hyprland build stage of the Copper image).
# Generated for Copper Linux; do not hand-edit the shipped copy without
# understanding your Hyprland version's accepted syntax.
#
# Keyboard shortcuts: keys in the input.table are combined with '+' and single
# spaces, e.g. `super + return = exec, "kitty", block`.

# ---------------------------------------------------------------------------
# Core
# ---------------------------------------------------------------------------
# Dot is the default. MonitorList is intentionally empty: Hyprland queries the
# DRM/KMS backend (and hyprctl) for monitors at startup, so a fixed layout is
# both unnecessary and harmful on machines with a different screen count.
# Uncomment only if a machine truly needs a fixed multi-monitor layout.
# MonitorLayout {
#     monitor = *, 0, 0, 3840x1080, 1
# }

# ---------------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------------
# Keyboard: repeat rate/delay and a flat accel profile for a predictable feel.
# The Copper image has no udev daemon and no input driver other than evdev, so
# libinput reads kernel capabilities directly; no extra configuration is
# required here for the keyboard or mouse to function.
input {
    useNightLight      = false
    followSystemCursor = false
    repeatRate         = 37
    repeatDelay        = 37
    accelProfile       = flat
    cursorAnimSize     = 1
    cursorVisibleTime  = 1500
    cursorFlushTime    = 100
    dpi = 96.0
    table {
        # Exit the compositor: a safe, documented quit rather than a panic.
        ctrl + alt + shift + esc = exec, "hyprctl quit", block
        # Reload the configuration without restarting.
        ctrl + alt + shift + r   = exec, "hyprctl reload", block
        # --- Copper default keybindings (see the task brief) ---
        super + return = exec, "kitty", block
        super + space  = exec, "fuzzel", block
        super + e      = exec, "thunar", block
        super + q      = killactive
        super + v      = togglefloating
        super + f      = fullscreen
        super + 1      = workspaceNumber, 1
        super + 2      = workspaceNumber, 2
        super + 3      = workspaceNumber, 3
        super + 4      = workspaceNumber, 4
        super + 5      = workspaceNumber, 5
        super + 6      = workspaceNumber, 6
        super + 7      = workspaceNumber, 7
        super + 8      = workspaceNumber, 8
        super + 9      = workspaceNumber, 9
        super + shift + 1 = movetoworkspace, 1
        super + shift + 2 = movetoworkspace, 2
        super + shift + 3 = movetoworkspace, 3
        super + shift + 4 = movetoworkspace, 4
        super + shift + 5 = movetoworkspace, 5
        super + shift + 6 = movetoworkspace, 6
        super + shift + 7 = movetoworkspace, 7
        super + shift + 8 = movetoworkspace, 8
        super + shift + 9 = movetoworkspace, 9
        # SUPER + mouse: move and resize a window (built in).
        super + m = exec, "hyprctl quit", block
    }
}

# ---------------------------------------------------------------------------
# Mouse
# ---------------------------------------------------------------------------
pointer {
    accelerationProfile = 1
    sensitivity         = 0.0
}

# ---------------------------------------------------------------------------
# Decoration
# ---------------------------------------------------------------------------
# Copper's visual identity: dark panels, a single copper accent for the
# active window, restrained rounding and no drop shadow clutter.
decoration {
    rounding              = 3
    dropShadow            = false
    outerBorder           = false
    activeDim             = true
    activeDimOpacity      = 0.12
    activeBlur            = none
    activeBgColor         = 120, 170, 210, 255
    activeFgColor         = 235, 235, 240, 255
    inactiveDim           = true
    inactiveDimOpacity    = 0.12
    inactiveBlur          = none
    inactiveBgColor       = 15, 23, 42, 200
    inactiveFgColor       = 180, 190, 210, 200
    inactiveBorderColor   = 60, 70, 90, 180
    inactiveBorderSize    = 1
    borderSize            = 1
    drawBackground        = true
    drawActiveTitleBar    = true
    drawInactiveTitleBar  = true
}

# ---------------------------------------------------------------------------
# Layout
# ---------------------------------------------------------------------------
general {
    borderSize       = 1
    crypted          = false
    newWindowPlacement = Snap
    workspaceCount   = 10
    # Copper: a single row of ten workspaces.
    windowSnap {
        enable = true
        snappers {
            top      = 130
            bottom   = 130
            left     = 150
            right    = 150
            topLeft  = 110
            topRight = 110
            bottomLeft  = 110
            bottomRight = 110
        }
    }
}

# ---------------------------------------------------------------------------
# Gaps
# ---------------------------------------------------------------------------
gaps {
    horizontal = 12
    vertical   = 12
    outer      = 8
}

# ---------------------------------------------------------------------------
# Animations
# ---------------------------------------------------------------------------
# Restrained, smooth motion. Keep the timeout moderate so the session stays
# snappy on older machines.
animation {
    timeout          = 100
    playing          = false
    singleEntry {
        method    = easeInOut
        duration  = 100
    }
    doubleEntry {
        method    = easeInOut
        duration  = 100
    }
}

# ---------------------------------------------------------------------------
# Startup
# ---------------------------------------------------------------------------
# One startup path: the compositor starts everything the session needs, in
# order, and nothing else is needed. Each line runs once, at first launch.
#
#   hyprpaper   the wallpaper, reading .config/hypr/hyprpaper.conf
#   waybar      the bar, reading .config/waybar/config.jsonc + style.css
#   dunst       notifications
#   hypridle    idle management (lock, then blank), reading hypridle.conf
#   polkit agent  authentication prompts for the portals
exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = hypridle
exec-once = hyprpolkitagent

# ---------------------------------------------------------------------------
# End of configuration
# ---------------------------------------------------------------------------
