[Settings]
# The deb stage drops an Ubuntu default here, but Copper ships no matching
# theme or icon set. Electron reads this file when no XSettings manager answers,
# and a missing theme/cursor is a known renderer SIGSEGV. Point the fallback at
# names that are actually on the image; XFCE's own xsettings still win in session.
gtk-theme-name = Adwaita-dark
gtk-icon-theme-name = Humanity
gtk-sound-theme-name = freedesktop
gtk-cursor-theme-name = DMZ-White
gtk-icon-sizes = panel-menu-bar=24,24
