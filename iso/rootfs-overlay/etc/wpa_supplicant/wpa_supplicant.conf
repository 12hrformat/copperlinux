# Copper Linux — wireless network configuration.
#
# wpa_supplicant reads this file. copper-init starts it at boot when the
# machine has a wireless interface and no wired one, waits for the interface to
# come up, and hands it to the DHCP client. Nothing here is secrets-free: the
# psk values below are passphrases, so treat this file like /etc/shadow.
#
# The easy way to add a network is the helper, which runs wpa_passphrase for
# you and never writes your passphrase in the clear:
#
#     sudo copper-wifi add "My Network" "my-passphrase"
#     sudo copper-wifi list
#
# By hand, each block is one network. A psk is the hex string that
# `wpa_passphrase SSID passphrase` prints — not the passphrase itself. An open
# network uses key_mgmt=NONE and no psk.
#
#     network={
#         ssid="My Network"
#         psk=0f2a...c1
#     }
#
#     network={
#         ssid="Guest"
#         key_mgmt=NONE
#     }

ctrl_interface=DIR=/run/wpa_supplicant GROUP=wheel
update_config=1
