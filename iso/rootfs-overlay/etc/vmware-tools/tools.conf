# Copper Linux -- VMware guest tools configuration.
#
# open-vm-tools' resolutionKMS plugin is what makes the guest console follow
# the VMware window: it listens for the host's resolution hints and programs
# the KMS connector, so dragging the window larger really grows the mode
# instead of stretching a smaller framebuffer into a soft image. The plugin is
# loaded by vmtoolsd, which copper-vmtools.service starts on the systemd image
# and copper-init's start_vmtools() starts on the busybox one.
#
# Upstream defaults this to true only when it finds an xf86-video-vmware newer
# than 13.2.0. Copper's desktop is Wayland-first and ships no Xorg VMware
# driver, so left to itself the plugin would stay off and the display would
# never autofit even with vmtoolsd running. Say it explicitly.
[resolutionKMS]
enable = true
