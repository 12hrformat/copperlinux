<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Copper's own fontconfig rules.

  This is a real file in the image, not a symlink into /usr/share/fontconfig
  created by a postinst: build_gui downloads debs and unpacks them with
  dpkg-deb, so no maintainer script ever runs. Anything a package would have
  installed in a postinst has to be written here by hand.

  Two jobs:

  1. Pin "monospace" to a face that is actually in the image. fontconfig's own
     60-latin.conf aliases the generic families, but its list predates the
     terminal faces Copper ships, so a request for "Monospace" could land on
     whatever the scan found first.

  2. Keep the symbol fonts reachable as per-glyph fallbacks. DejaVu Sans Mono
     has no braille block, and btop draws its graphs in braille whenever it is
     inside a terminal; the braille glyphs come from DejaVu Sans. Emoji come
     from Noto Color Emoji, dingbats that neither has come from Symbola and
     Noto Sans Symbols 2, and prompt themes get their private-use glyphs from
     Powerline and Font Awesome. VTE asks per glyph, so a weak append here is
     what turns a tofu box into a icon.
-->
<fontconfig>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
      <family>JetBrains Mono</family>
      <family>Hack</family>
      <family>Fira Code</family>
      <family>Liberation Mono</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>DejaVu Sans</string>
      <string>Symbola</string>
      <string>Noto Sans Symbols 2</string>
      <string>PowerlineSymbols</string>
      <string>Font Awesome 6 Free</string>
      <string>Font Awesome 6 Brands</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
