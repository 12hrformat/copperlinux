# Copper Linux settings.
#
# This is the machine's own preference file: the first-boot wizard writes it,
# and changing a line here changes what the next session starts. Every key is
# optional; a missing key, an unknown value or an unreadable file falls back to
# the default shown beside it.
#
#   shell=bash|zsh              the session's login shell (default: bash)
#   audio=pulseaudio|pipewire   the audio server started with the desktop
#                               (default: pulseaudio)
#
# Both audio backends and both shells are installed, so switching is a one-line
# edit rather than a reinstall:
#
#   sed -i 's/^shell=.*/shell=zsh/'         /etc/copper.conf
#   sed -i 's/^audio=.*/audio=pipewire/'    /etc/copper.conf
#
# The init (PID 1) is chosen at boot instead, because it has to be decided
# before this file is readable: the boot entries carry a "systemd init" entry,
# and /etc/copper-init records the default the wizard chose. See
# iso/live/init and iso/boot/entries.

shell=bash
audio=pulseaudio
