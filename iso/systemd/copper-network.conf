# Copper Linux — udevd, and the one thing it changes for the session.
# 1. Interface-naming policy is off: Predictable Names would rename the VMware NIC
# ens33, but the docs and the user's typing say eth0. 99-default.link is a symlink
# to /dev/null -- the idiom for "does not apply" (empty != no .link file) -- and it
# belongs in /etc/systemd/network, where link policy lives. copper-dhcp asks sysfs
# for a real link layer anyway; keeping kernel names makes its answer still eth0.
# 2. The file exists because the image shipped no udevd (bug 34): /dev was
# devtmpfs's static list and libinput's /run/udev/data records were hand-seeded by
# copper-init, guessing metadata only real udev has. Under systemd, udevd writes
# them itself and --console skips the seeder.
# No [Match]: this file is documentation and link policy, not a matched rule; the
# .link policy itself is the 99-default.link symlink build_systemd creates.
