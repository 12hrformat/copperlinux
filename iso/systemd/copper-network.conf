# Copper Linux — udevd, and the one thing it changes for the session.
#
# This file is two decisions in one place.
#
# 1. The interface-naming policy is off. systemd's Predictable Network
#    Interface Names would rename the VMware NIC ens33, and the console's own
#    documentation and the user's own typing both say eth0.
#    99-default.link is a symlink to /dev/null: the standard systemd idiom for
#    "this policy does not apply", because an empty .link file and no .link
#    file mean the opposite things.
#
#    It lives here, in the file that documents the udev situation, rather than
#    in an /etc/udev/rules.d/ drop-in, because /etc/systemd/network/ is where
#    link policy belongs and this is a link policy.
#
#    The DHCP unit does not depend on the name either way: copper-dhcp asks
#    sysfs which interface has a real link layer, the same way copper-init does
#    for the busybox image. Keeping the kernel's names means the interface it
#    finds is still the one the console calls eth0, which is the point.
#
# 2. Why the file exists at all, for the next reader. The image shipped no
#    udev daemon (bug 34): with no udevd, /dev is devtmpfs's
#    static list and the /run/udev/data records libinput needs were written by
#    hand by copper-init's seed_udev_input_db(), guessing at metadata only a
#    real udev has (ID_INPUT_KEYBOARD and friends). Under systemd, udevd runs,
#    produces those records itself, and copper-init --console skips its seeder
#    so the guesses are never laid over the real answer.
#
# No [Match] section is deliberate: this file is documentation and link
# policy, not a matched rule, and the .link policy itself is the symlink in
# /etc/systemd/network/99-default.link that build_systemd creates.
#
# handcrafted by 12hrformat (SYSTEMD-MIGRATION.md, phase 1; bug 34's premise)
