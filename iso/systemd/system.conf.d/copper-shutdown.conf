# Copper Linux -- cap how long a stop is allowed to take.
#
# systemd's default is 90 s per unit, and it applies to every unit. The live
# image has no long-lived state worth waiting ninety seconds for, so a single
# unit that ignores SIGTERM (a compositor, a terminal, the DHCP client, the
# journal) could hold the whole reboot for a minute and a half -- and several
# such units run in parallel but are all waited on before shutdown.target is
# reached, which is how one wedged process reads as a multi-minute hang.
#
# Ten seconds is far more than any unit in this image needs to stop, and short
# enough that a wedged one cannot hold the machine. Nothing is lost when it
# fires: this is a live image, the session is being discarded anyway.
#
# copper-zram.service overrides this with its own, larger TimeoutStopSec
# because deactivating swap is genuinely more expensive; per-unit settings win
# over this default, so the swap still gets its bound (30 s) rather than this
# one. See iso/systemd/copper-zram-stop for why swap must be drained before
# systemd-shutdown runs at all.
#
# This is a drop-in in /etc/systemd/system.conf.d, not a replacement for
# /etc/systemd/system.conf: the image ships no system.conf of its own, and
# overriding one key must not hide the rest of the manager's defaults.
[Manager]
DefaultTimeoutStopSec=10s
