# Copper Linux -- cap how long a stop is allowed to take.
# systemd's default is 90 s per unit, applied to everything; a compositor or
# terminal ignoring SIGTERM could hold the whole reboot that long, and several in
# parallel are all waited on before shutdown.target.
# Ten seconds is more than any unit here needs and short enough that a wedged one
# cannot hold the machine; nothing is lost, the session is being discarded.
# copper-zram.service overrides it (30 s) because draining swap is genuinely
# slower; per-unit settings win. See iso/systemd/copper-zram-stop for why swap must
# be drained before systemd-shutdown at all.
# A drop-in in /etc/systemd/system.conf.d, not a replacement for system.conf:
# the image ships none, and overriding one key must not hide the rest of the defaults.
[Manager]
DefaultTimeoutStopSec=10s
