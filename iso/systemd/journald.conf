# Copper Linux -- keep journald's memory footprint bounded.
#
# This is a live image: nothing in the journal needs to survive a reboot (the
# writable layer is either a tmpfs or a persistence disk whose contents are the
# user's, not the journal's), and a desktop that is being asked to fit in 4 GB
# cannot hand journald an unbounded share of it. Storage=volatile keeps the
# journal in /run, RuntimeMaxUse caps it at 32 MiB, and Compress=yes makes the
# cap go further. The boot messages the wizard and the console care about are
# a few hundred KiB; 32 MiB is generous for them and invisible next to a
# browser.
[Journal]
Storage=volatile
Compress=yes
RuntimeMaxUse=32M
RuntimeKeepFree=8M
