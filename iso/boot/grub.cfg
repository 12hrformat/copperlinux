# Copper Linux — handcrafted by 12hrformat
set timeout=5
set default=0

# Console order matters more than it looks. The kernel registers every
# console= it is given, so printk goes to all of them and the serial log
# still sees the kernel side. But /dev/console — which is what init and
# everything after it write to — is the *last* one listed. Putting ttyS0
# last therefore sent our own messages to a serial port that a VM without
# one does not have, and the screen sat on "Booting up kernel" looking like
# a hang. tty0 last, so the screen stays the thing you are watching.
menuentry "Copper Linux" {
    insmod all_video
    insmod iso9660
    insmod part_msdos
    search --set=root --file /boot/grub/grub.cfg
    linux /boot/vmlinuz quiet console=ttyS0,115200 console=tty0
    initrd /boot/initrd.img
}

menuentry "Copper Linux (verbose)" {
    insmod all_video
    insmod iso9660
    insmod part_msdos
    search --set=root --file /boot/grub/grub.cfg
    linux /boot/vmlinuz console=ttyS0,115200 console=tty0 panic=10
    initrd /boot/initrd.img
}

# Everything the kernel has, including KERN_DEBUG, which is where a driver
# that is about to hang usually says something first. panic=10 so a kernel
# that does wedge reboots and shows its face instead of sitting there.
menuentry "Copper Linux (debug)" {
    insmod all_video
    insmod iso9660
    insmod part_msdos
    search --set=root --file /boot/grub/grub.cfg
    linux /boot/vmlinuz console=ttyS0,115200 console=tty0 ignore_loglevel loglevel=8 earlyprintk=serial,ttyS0,115200 panic=10
    initrd /boot/initrd.img
}

# Straight to a shell inside the initramfs, skipping the overlay entirely. If
# this one gives a prompt, the kernel and the initrd loaded fine and the
# problem is in what /init does; if it hangs on "Booting up kernel" too, then
# /init never ran and the kernel file is what to look at. That one question
# splits the search space in half, which is worth having.
menuentry "Copper Linux (initramfs shell)" {
    insmod all_video
    insmod iso9660
    insmod part_msdos
    search --set=root --file /boot/grub/grub.cfg
    linux /boot/vmlinuz console=ttyS0,115200 console=tty0 rdinit=/bin/busybox sh
    initrd /boot/initrd.img
}
