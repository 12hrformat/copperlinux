set timeout=5
set default=0

menuentry "Copper Linux" {
    insmod all_video
    insmod iso9660
    insmod part_msdos
    search --set=root --file /boot/grub/grub.cfg
    linux /boot/vmlinuz quiet
    initrd /boot/initrd.img
}

menuentry "Copper Linux (verbose)" {
    insmod all_video
    insmod iso9660
    insmod part_msdos
    search --set=root --file /boot/grub/grub.cfg
    linux /boot/vmlinuz
    initrd /boot/initrd.img
}