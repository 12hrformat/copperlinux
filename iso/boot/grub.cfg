# Copper Linux — handcrafted by 12hrformat
set timeout=5
set default=0

# console=ttyS0 goes to the VM's serial port, which can be pointed at a file
# on the host. It is on every entry, including the quiet one, so a boot can
# always be captured without photographing a screen.
menuentry "Copper Linux" {
    insmod all_video
    insmod iso9660
    insmod part_msdos
    search --set=root --file /boot/grub/grub.cfg
    linux /boot/vmlinuz quiet console=tty0 console=ttyS0,115200
    initrd /boot/initrd.img
}

menuentry "Copper Linux (verbose)" {
    insmod all_video
    insmod iso9660
    insmod part_msdos
    search --set=root --file /boot/grub/grub.cfg
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200
    initrd /boot/initrd.img
}

# Everything the kernel has, including KERN_DEBUG, which is where a driver
# that is about to hang usually says something first.
menuentry "Copper Linux (debug)" {
    insmod all_video
    insmod iso9660
    insmod part_msdos
    search --set=root --file /boot/grub/grub.cfg
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 ignore_loglevel loglevel=8 earlyprintk=serial,ttyS0,115200
    initrd /boot/initrd.img
}

# Straight to a shell inside the initramfs, skipping the overlay entirely. If
# this one gives a prompt, the problem is in what /init does; if this one also
# hangs, the problem is the kernel or the initrd and /init never ran.
menuentry "Copper Linux (initramfs shell)" {
    insmod all_video
    insmod iso9660
    insmod part_msdos
    search --set=root --file /boot/grub/grub.cfg
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/bin/busybox sh
    initrd /boot/initrd.img
}
