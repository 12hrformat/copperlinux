# Copper's pacman config.
#
# Signature checking is off: the image has no keyring yet, and everything
# is downloaded from the official Arch mirrors over https.
#
# IgnorePkg lists the packages the image already provides itself (the stub
# packages in /var/lib/pacman/local). Arch's own versions of those must
# never land here -- they would replace the libraries the desktop already
# runs on.

[options]
Architecture = auto
CheckSpace
HoldPkg = pacman glibc
IgnorePkg = pacman glibc gcc-libs bash filesystem coreutils ncurses readline zlib openssl
SigLevel = Never
LocalFileSigLevel = Never

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
